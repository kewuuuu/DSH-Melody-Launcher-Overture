name: SignPath signing

# 由 SignPath 云端 HSM 签名三件产物。没配仓库变量时整体跳过，发布不会因此变红。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要送签的发布标签（例如 v1.1.3）
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: signpath-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          New-Item -ItemType Directory -Path unsigned -Force | Out-Null
          gh release download $env:TAG --pattern '*.exe' --dir unsigned
          Get-ChildItem unsigned | Select-Object Name, Length
      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: kewu-unsigned
          path: unsigned/*.exe
          if-no-files-found: error
      - name: Submit signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Replace release assets with signed builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          Get-ChildItem signed -Recurse -Filter *.exe | ForEach-Object {
            Write-Output ("signed: " + $_.FullName + " " + $_.Length)
            gh release upload $env.TAG $_.FullName --clobber
          }
